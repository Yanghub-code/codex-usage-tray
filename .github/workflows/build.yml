name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1 -Version 2.0.2

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CodexUsageTray-v2.0.2-win-x64
          path: |
            artifacts/CodexUsageTray-v2.0.2-win-x64.zip
            artifacts/CodexUsageTray-v2.0.2-win-x64.zip.sha256
          if-no-files-found: error
