name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build release package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\package.ps1 -Version $version

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem -LiteralPath .\artifacts -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } |
            ForEach-Object { $_.FullName }
          gh release create '${{ github.ref_name }}' $assets --verify-tag --generate-notes --title 'Codex Usage Tray ${{ github.ref_name }}'
